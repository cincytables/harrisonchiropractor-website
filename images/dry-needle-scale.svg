<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <text x="600" y="76" text-anchor="middle" fill="#174734" font-family="Georgia,serif" font-size="54">How fine is a dry needling needle?</text>
  <text x="600" y="122" text-anchor="middle" fill="#627267" font-family="Arial,sans-serif" font-size="30">A simple diameter comparison — approximate and shown at the same scale</text>
  <line x1="600" y1="165" x2="600" y2="480" stroke="#d8dfd4" stroke-width="2"/>
  <line x1="400" y1="165" x2="400" y2="480" stroke="#d8dfd4" stroke-width="2"/>
  <line x1="800" y1="165" x2="800" y2="480" stroke="#d8dfd4" stroke-width="2"/>
  <circle cx="200" cy="315" r="14" fill="#b48a13"/>
  <circle cx="600" cy="315" r="50" fill="#174734"/>
  <circle cx="1000" cy="315" r="140" fill="#56615c"/>
  <text x="200" y="505" text-anchor="middle" fill="#174734" font-family="Georgia,serif" font-size="38">Human hair</text>
  <text x="200" y="545" text-anchor="middle" fill="#627267" font-family="Arial,sans-serif" font-size="31">about 0.07 mm</text>
  <text x="600" y="505" text-anchor="middle" fill="#174734" font-family="Georgia,serif" font-size="38">Dry needling needle</text>
  <text x="600" y="545" text-anchor="middle" fill="#627267" font-family="Arial,sans-serif" font-size="31">about 0.25 mm</text>
  <text x="1000" y="505" text-anchor="middle" fill="#174734" font-family="Georgia,serif" font-size="38">Sewing needle</text>
  <text x="1000" y="545" text-anchor="middle" fill="#627267" font-family="Arial,sans-serif" font-size="31">about 0.7 mm</text>
</svg>
